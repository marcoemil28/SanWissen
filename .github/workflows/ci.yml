name: 'PR-Prüfung'

# Läuft bei jedem Pull Request und auf main. Bis 1.1.0 gab es nur den
# Release-Workflow, der ausschließlich auf Tags reagiert: ein Fehler fiel
# damit erst beim Bauen der Installer auf, also lange nach dem Merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen, wenn nachgeschoben wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inhalte-und-frontend:
    name: 'Inhalte & Frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Prüft die Inhalte gegen die Schemas unter content/schema/ und
      # kontrolliert, dass alle Verweise aus Fahrplan, Cheat-Sheet, Quiz und
      # Glossar auflösen. Steckt in `npm run build`, läuft hier aber vorweg,
      # damit ein Inhaltsfehler als solcher im Protokoll steht.
      - name: Inhalte prüfen
        run: npm run check-content

      - name: Typen prüfen und bauen
        run: npm run build

  ios:
    name: 'iOS-App bauen'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Ohne ios/Signing.local.xcconfig baut das Projekt mit Platzhaltern.
      # Für den Simulator genügt das; signiert wird erst beim Verteilen.
      - name: Für den Simulator bauen
        run: |
          xcodebuild \
            -project ios/SanWissen.xcodeproj \
            -scheme SanWissen \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  tauri-rust:
    name: 'Tauri-Backend prüfen'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Nur `cargo check`, kein vollständiger Build: es geht darum,
      # Rust-Fehler vor dem Tag zu finden, nicht Installer zu erzeugen.
      # Auf macOS braucht Tauri dafür keine zusätzlichen Systempakete.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
